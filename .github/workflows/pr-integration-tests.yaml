name: Integration Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
  push:
    branches:
      - main
  merge_group:

# Several plugins' integration tests hit shared external test servers (e.g.
# webvh's sandbox.bcvh.vonx.io, a bare uvicorn instance with a small
# connection backlog). Serialize runs across the whole repo, rather than per
# branch/PR, so concurrent CI runs from different PRs don't pile onto that
# shared server at once and trip connection refusals.
concurrency:
  group: integration-tests-shared-external-servers
  cancel-in-progress: false

jobs:
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    if: (github.repository == 'openwallet-foundation/acapy-plugins') && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name != 'pull_request'))
    steps:
      #----------------------------------------------
      #       Check out repo
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
      #----------------------------------------------
      #       Get changed files
      #----------------------------------------------
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
      #----------------------------------------------
      #       Get changed plugins
      #----------------------------------------------
      - name: Get changed plugins
        id: changed-plugins
        run: |

          # Collects all the plugin names that have changes. 
          # If there is directory that isn't a plugin then it will need to skip it. Currently skipping plugin_globals
          declare -a changed_dirs=()
          for dir in ./*/; do
            current_folder=$(basename "$dir")
            if [[ $current_folder == "plugin_globals" ]]; then
              continue
            fi
            for changed_file in ${{ steps.changed-files.outputs.all_changed_files }}; do
              if [[ $changed_file == *"$current_folder"* ]]; then
                if ! [[ ${changed_dirs[*]} =~ $current_folder ]]; then
                  changed_dirs+=("$current_folder")
                fi
              fi
            done
          done

          # Remove any lite plugins from the changed_dirs array
          readarray -t lite_plugin_array < lite_plugins

          echo "${changed_dirs[@]}"
          echo "${lite_plugin_array[@]}"
          # Function to remove items in array2 from array1
          remove_items() {
              local -n source_array=$1
              local -n remove_array=$2
              local temp_array=()

              for item in "${source_array[@]}"; do
                  skip=false
                  for remove_item in "${remove_array[@]}"; do
                      if [[ "$item" == "$remove_item" ]]; then
                          skip=true
                          break
                      fi
                  done
                  if ! $skip; then
                      temp_array+=("$item")
                  fi
              done

              source_array=("${temp_array[@]}")
          }

          remove_items changed_dirs lite_plugin_array

          echo "changed-plugins=${changed_dirs[*]}" >> $GITHUB_OUTPUT

      #----------------------------------------------
      #       Run Integration Tests
      #----------------------------------------------
      - name: Run Integration Tests
        id: integration-tests
        shell: bash
        run: |
          for dir in ${{ steps.changed-plugins.outputs.changed-plugins }}; do

            if [[ "$dir" == "cheqd" ]]; then
              echo "⏭️  Skipping integration tests for $dir"
              continue
            fi

            echo "🔧 Running integration tests for $dir"
            cd "$dir/integration"

            # Source init-network.sh if it exists
            if [ -f ./init-network.sh ]; then
              echo "📡 Sourcing init-network.sh"
              . ./init-network.sh
            fi

            docker compose build

            # webvh's integration tests depend on a shared external test server
            # (sandbox.bcvh.vonx.io) that occasionally has transient
            # connectivity blips. Retry the whole stack once, since a fresh
            # `up` re-establishes all DID/connection state cleanly rather than
            # trying to patch up individual failed tests.
            MAX_ATTEMPTS=1
            if [[ "$dir" == "webvh" ]]; then
              MAX_ATTEMPTS=2
            fi
            attempt=1
            TEST_EXIT=1
            while [[ $attempt -le $MAX_ATTEMPTS ]]; do
              echo "🧪 Attempt $attempt/$MAX_ATTEMPTS for $dir"

              if [[ "$dir" == "cache_redis" ]]; then
                # Start everything in the background
                echo "🚀 Starting docker compose stack..."
                docker compose up -d

                echo "🧪 Running tests container..."
                # `if` guards the command from bash's `set -e` (used by GitHub
                # Actions' `shell: bash`), which would otherwise abort the
                # whole step here instead of letting the loop retry.
                if docker compose run --rm tests; then
                  TEST_EXIT=0
                else
                  TEST_EXIT=$?
                fi
              else
                # Normal plugin flow
                if docker compose up --exit-code-from tests; then
                  TEST_EXIT=0
                else
                  TEST_EXIT=$?
                fi
              fi

              if [[ $TEST_EXIT -eq 0 ]]; then
                break
              fi

              if [[ $attempt -lt $MAX_ATTEMPTS ]]; then
                echo "⚠️  Attempt $attempt failed for $dir - retrying in case of a transient external server issue..."
                docker compose down --remove-orphans
                sleep 15
              fi

              attempt=$((attempt + 1))
            done

            if [[ $TEST_EXIT -ne 0 ]]; then
              echo "❌ Tests failed for $dir after $MAX_ATTEMPTS attempts - dumping logs:"
              docker compose logs || true
              docker compose down --remove-orphans
              docker system prune -af --volumes
              exit $TEST_EXIT
            fi

            echo "✅ Tests passed for $dir"
            docker compose down --remove-orphans
            docker system prune -af --volumes
            cd ../..
          done